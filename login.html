<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Login - Coded Funds</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            background: #0d1117;
            font-family: Arial, sans-serif;
            color: white;

            display: flex;
            justify-content: center;
            align-items: center;

            min-height: 100vh;
            padding: 20px;
        }

        .login-box {
            width: 100%;
            max-width: 380px;

            background: #161b22;

            padding: 30px;

            border-radius: 15px;

            border: 2px solid gold;

            box-shadow:
                0 0 20px rgba(255, 215, 0, 0.15);
        }

        h2 {
            text-align: center;
            color: gold;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 7px;
        }

        input {
            width: 100%;

            padding: 13px;

            margin-bottom: 5px;

            border: none;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus {
            outline: 2px solid gold;
        }

        button {
            width: 100%;

            padding: 13px;

            margin-top: 20px;

            background: gold;

            color: black;

            border: none;

            border-radius: 8px;

            font-size: 18px;

            font-weight: bold;

            cursor: pointer;
        }

        button:hover {
            background: #ffd900;
        }

        button:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        p {
            text-align: center;
            margin-top: 20px;
        }

        a {
            color: gold;
            text-decoration: none;
            font-weight: bold;
        }

        a:hover {
            text-decoration: underline;
        }

    </style>

</head>


<body>


    <div class="login-box">

        <h2>
            👑 Coded Funds Login
        </h2>


        <label for="email">
            Email Address
        </label>

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            autocomplete="email"
        >


        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
        >


        <button
            type="button"
            id="loginBtn">

            🔐 Login

        </button>


        <p>
            Don't have an account?
            <br>

            <a href="register.html">
                Create Account
            </a>
        </p>

    </div>


    <!-- Firebase Login JavaScript -->

    <script
        type="module"
        src="./login.js">
    </script>


</body>

</html>
